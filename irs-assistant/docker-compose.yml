services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: irs
      POSTGRES_PASSWORD: irs
      POSTGRES_DB: irs_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irs -d irs_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
